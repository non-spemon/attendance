name: Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # 手動で実行ボタンを押すことも可能にする設定

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # エックスサーバーの公開ディレクトリを指定
          server-dir: /nonpoko.com/public_html/attendance/
          # サーバーに上げたくないファイル・フォルダを指定する
          exclude: |
            **/.git*
            **/.git*/**
            **/.github*
            **/.github*/**
            node_modules/**